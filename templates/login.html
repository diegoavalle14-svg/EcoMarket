{% extends "base.html" %}
{% block title %}EcoMarket - Inicio de Sesion{% endblock %}

{% block content %}

<section class="hero" style="padding:48px 20px 32px;background:transparent;">
  <h2 style="font-size:2.8rem;">EcoMarket</h2>
  <p>Bienvenido a EcoMarket: calidad, conciencia y comodidad.</p>
</section>

<div style="display:flex;justify-content:center;align-items:center;padding:20px 20px 60px;">
  <div style="
      background:var(--bg-card);
      border:1px solid var(--border);
      border-radius:var(--radius-lg);
      padding:36px 32px 30px;
      width:100%;
      max-width:420px;
      display:flex;
      flex-direction:column;
      gap:18px;
  ">
    <h2 style="color:var(--accent);text-align:center;font-weight:700;font-size:1.8rem;margin:0;">
      Iniciar Sesion
    </h2>

    <form id="loginForm" action="/auth/login" method="POST"
          style="display:flex;flex-direction:column;gap:14px;">

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="username" style="color:var(--text-secondary);font-weight:600;font-size:0.85rem;">
          Nombre de Usuario
        </label>
        <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required
          style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
                 font-size:0.9rem;background:var(--bg-primary);color:var(--text-primary);
                 box-sizing:border-box;outline:none;">
      </div>

      <div style="display:flex;flex-direction:column;gap:6px;">
        <label for="password" style="color:var(--text-secondary);font-weight:600;font-size:0.85rem;">
          Contrasena
        </label>
        <input type="password" id="password" name="password" placeholder="Ingresa tu contrasena" required
          style="width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);
                 font-size:0.9rem;background:var(--bg-primary);color:var(--text-primary);
                 box-sizing:border-box;outline:none;">
      </div>

      <button type="submit" style="
        width:100%;padding:12px;
        background:var(--accent-dim);color:#fff;border:none;
        border-radius:var(--radius-sm);font-size:0.95rem;font-weight:600;
        cursor:pointer;transition:0.25s;margin-top:4px;
      ">
        Ingresar
      </button>
    </form>

    <div style="position:relative;text-align:center;margin:4px 0;font-size:0.8rem;color:var(--text-muted);">
      <span style="background:var(--bg-card);padding:0 14px;position:relative;z-index:1;">O</span>
      <span style="position:absolute;left:0;top:50%;width:100%;height:1px;background:var(--border);z-index:0;"></span>
    </div>

    <div style="text-align:center;font-size:0.85rem;color:var(--text-secondary);">
      <p style="margin:0;">
        No tienes cuenta?
        <a href="/auth/register" style="color:var(--accent);font-weight:600;">Registrate aqui</a>
      </p>
    </div>

    <button type="button" onclick="window.location.href='/'" style="
      width:100%;padding:10px;
      background:var(--bg-primary);color:var(--text-secondary);
      border:1px solid var(--border);border-radius:var(--radius-sm);
      font-size:0.9rem;font-weight:600;cursor:pointer;
    ">
      Volver al Menu Principal
    </button>
  </div>
</div>

{% endblock %}
